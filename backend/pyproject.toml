[project]
name = "eyedentity-backend"
version = "1.0.0"
description = "Eyedentity FastAPI backend — iris segmentation and 4x AI upscaling"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
strict = true

[tool.ruff]
line-length = 100
