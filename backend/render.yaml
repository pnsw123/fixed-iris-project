---
services:
  - type: web
    name: eyedentity-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PURCHASE_BACKEND
        value: redis
      - key: REDIS_URL
        fromService:
          type: redis
          name: eyedentity-redis
          property: connectionString

databases:
  - type: redis
    name: eyedentity-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
